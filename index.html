<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gesture Racing Game</title>

    <link rel="stylesheet" href="style.css">

    <!-- MediaPipe Hand Tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>

<body>

    <header>
        <h1>🏎️ Gesture Racing Game</h1>
        <p>Control the car using your fingers</p>
    </header>

    <div class="game-container">

        <!-- GAME -->
        <div class="game-section">

            <canvas id="gameCanvas"></canvas>

            <div class="game-info">
                <div>
                    Speed
                    <span id="speed">0</span>
                </div>

                <div>
                    Score
                    <span id="score">0</span>
                </div>

                <div>
                    Distance
                    <span id="distance">0</span>
                </div>
            </div>

            <button id="startButton">START GAME</button>

        </div>


        <!-- CAMERA -->
        <div class="camera-section">

            <h2>📷 Hand Control</h2>

            <video id="video" autoplay playsinline></video>

            <canvas id="handCanvas"></canvas>

            <div class="gesture-box">
                Gesture:
                <strong id="gesture">
                    Waiting...
                </strong>
            </div>

            <div class="instructions">

                <h3>Controls</h3>

                <p>🖐️ Open Palm → Accelerate</p>

                <p>✊ Fist → Brake</p>

                <p>👈 Move Hand Left → Left</p>

                <p>👉 Move Hand Right → Right</p>

                <p>⌨️ Arrow Keys → Keyboard Control</p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
